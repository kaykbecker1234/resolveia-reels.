<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--paper:#E6E8F2;--ink:#1C3752;--acc:#6FB4FF;--acc2:#2F6FB0;--bg1:#123A5C;--bg2:#0A1C2C;--blob:#1A4C78;--leaf:#1C4A75;--muted:#8FA3B8;--red:#E5484D;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050608}
body{font-family:'Poppins',sans-serif;color:#fff;position:relative}
.abs{position:absolute}
.cx{left:0;right:0;margin-left:auto;margin-right:auto;width:fit-content}
.serif{font-family:'Playfair Display',serif}
.scene{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 75%,var(--bg1) 0%,var(--bg2) 45%,#050608 100%)}
.blob{position:absolute;border-radius:50%;background:var(--blob);filter:blur(30px);opacity:.55}
.leaf{position:absolute;filter:blur(14px);opacity:.6}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:screen;opacity:.07;pointer-events:none}
.frame{position:absolute;inset:0;pointer-events:none}
.vt{position:absolute;font-size:22px;letter-spacing:3px;color:rgba(255,255,255,.45);white-space:nowrap;text-transform:uppercase}
.corner{position:absolute;width:56px;height:56px;border-color:rgba(255,255,255,.35);border-style:solid;border-width:0}
.dash{border:2.5px dashed currentColor;padding:6px 26px;position:relative}
.dash::before,.dash::after{content:"";position:absolute;width:12px;height:12px;background:#fff;border:2px solid currentColor}
.dash::before{left:-8px;top:-8px}.dash::after{right:-8px;bottom:-8px}
.pill{border:3px solid #fff;border-radius:999px;padding:14px 44px;font-weight:800;font-size:58px;letter-spacing:1px;white-space:nowrap}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.25);border-radius:44px}
.caret::after{content:"|";margin-left:4px;opacity:.8}
.bub{position:absolute;padding:18px 26px;border-radius:26px;font-size:34px;line-height:1.3;max-width:600px;color:#111}
.bub.in{background:#fff;border-top-left-radius:6px;left:30px}
.bub.out{background:#D9FDD3;border-top-right-radius:6px;right:30px}
.bub small{display:block;font-size:20px;color:#667;text-align:right;margin-top:4px}
.lnk{color:#1B7FD1;font-weight:600}
.tile{width:150px;height:150px;border-radius:22px;display:flex;align-items:flex-end;justify-content:center;padding:10px;font-size:20px;font-weight:600;color:#fff;text-align:center;line-height:1.1}
</style></head>
